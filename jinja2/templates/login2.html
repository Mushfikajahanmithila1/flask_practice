<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My site</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            padding: 25px;
        }
        header{
            background-color: rgb(238, 73, 95);
            color: white;
            padding: auto;
            margin: auto;
            text-align: center;
        }
        footer{
            background-color: rgb(60, 160, 94);
            color: white;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h2>My site</h2>
    </header>
    <form method="POST", action="/submit">
        <h3>Username</h3>
        <input type="text", name="username", placeholder="Enter your username"><br><br>
        <h3>Password</h3>
        <input type="password", name="password", placeholder="Enter your password"><br><br>
        <input type="submit", value="Login">
    </form>
    <footer>
        <p>@2026 First Flask app</p>
    </footer>
</body>
</html>
